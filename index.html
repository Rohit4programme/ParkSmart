<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParkSmart - Smart Parking Spot Finder</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- First frame of the page background, so the fixed layer paints a real
         image immediately instead of a blank canvas. Same URL the <video>
         poster and the .app-background CSS fallback use: fetched once. -->
    <link rel="preload" as="image" href="/parking-background-poster.jpg" type="image/jpeg" />
  </head>
  <!-- No background colour here: `VideoBackground` owns the page background. -->
  <body class="h-full w-full text-slate-800 antialiased font-sans overflow-x-hidden">
    <div id="root" class="h-full w-full overflow-x-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
